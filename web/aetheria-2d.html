<meta charset="utf-8">
<title>Crônicas de Aetheria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Uncial+Antiqua&display=swap">
<style>
/* Layout: one lit 16:9 stage floating on forest-ink, a quiet legend of controls beneath */
:root{
  --ink:#0c110b; --wood:#2a1d12; --gold:#e6c36a; --moss:#86b84a; --text:#efe4c8; --muted:#a89c7c;
  --disp:'Uncial Antiqua','Palatino Linotype',Georgia,serif;
  --body:'Alegreya',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background-color:var(--ink);background-image:radial-gradient(ellipse at 50% 35%,#1b2717 0%,var(--ink) 70%);color:var(--text);font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-block:12px;box-sizing:border-box;overflow:hidden}
#wrap{position:relative;width:min(100%,calc((100dvh - 84px)*16/9));aspect-ratio:16/9;max-width:100%}
#game{width:100%;height:100%;display:block;border-radius:4px;background:#000;outline:none;box-shadow:0 0 0 2px #4a3620,0 0 0 6px #140e08,0 24px 70px rgba(0,0,0,.7)}
#game:focus-visible{box-shadow:0 0 0 2px var(--gold),0 0 0 6px #140e08,0 24px 70px rgba(0,0,0,.7)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:13px;color:var(--muted);max-width:100%}
.legend b{color:var(--gold);font-weight:700;letter-spacing:.04em}
#touch{display:none;width:100%;max-width:680px;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
#joy{position:relative;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,#2a2014 0%,#17110a 70%);box-shadow:inset 0 0 0 2px #5a4428;touch-action:none;flex:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98a,#b8893a 70%);box-shadow:0 3px 8px rgba(0,0,0,.5);pointer-events:none}
.btns{display:grid;grid-template-columns:repeat(3,62px);gap:8px}
.btns button{height:52px;border-radius:14px;border:0;background:#2a1d12;color:var(--gold);font:700 13px var(--body);box-shadow:inset 0 0 0 2px #5a4428;touch-action:none}
.btns button.big{background:#5a2a18;color:#fbe7b5}
.btns button:active{background:#6a4a26}
@media (pointer:coarse){
  #touch{display:flex}
  .legend{display:none}
  #wrap{width:min(100%,calc((100dvh - 190px)*16/9))}
}
</style>

<div id="wrap"><canvas id="game" tabindex="0" aria-label="Crônicas de Aetheria — jogo"></canvas></div>
<div class="legend" aria-label="Controles">
  <span><b>WASD / Setas</b> mover</span><span><b>J</b> espada</span><span><b>K</b> magia</span>
  <span><b>L</b> esquiva</span><span><b>Q / E</b> trocar magia</span><span><b>R</b> poção</span>
  <span><b>Espaço</b> falar / confirmar</span><span><b>Esc</b> pausa</span><span><b>M</b> som</span>
</div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="btns">
    <button data-act="prev">◀ Magia</button><button data-act="potion">Poção</button><button data-act="next">Magia ▶</button>
    <button data-act="dash">Esquiva</button><button data-act="magic" class="big">Magia</button><button data-act="attack" class="big">Espada</button>
  </div>
</div>

<script>
(()=>{
'use strict';
// ================= setup =================
const W=640,H=360;
const cv=document.getElementById('game');
cv.width=W*2; cv.height=H*2;
const ctx=cv.getContext('2d');
const DISP="'Uncial Antiqua','Palatino Linotype',Georgia,serif", BODY="'Alegreya',Georgia,serif";
const TAU=Math.PI*2;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const rnd=(a,b)=>a+Math.random()*(b-a);
let R=Math.random; const rr=(a,b)=>a+R()*(b-a); const pick=a=>a[(R()*a.length)|0];

// ================= audio =================
const AU={c:null,master:null,bus:null,sfx:null,muted:false,song:null,name:'',step:0,nextT:0};
function audioInit(){
  if(AU.c){ if(AU.c.state==='suspended') AU.c.resume(); return }
  try{
    const AC=window.AudioContext||window.webkitAudioContext; const c=new AC(); AU.c=c;
    AU.master=c.createGain(); AU.master.gain.value=AU.muted?0:.8; AU.master.connect(c.destination);
    AU.bus=c.createGain(); AU.bus.gain.value=.55; AU.bus.connect(AU.master);
    const dl=c.createDelay(); dl.delayTime.value=.3; const fb=c.createGain(); fb.gain.value=.32; const wet=c.createGain(); wet.gain.value=.35;
    AU.bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(AU.master);
    AU.sfx=c.createGain(); AU.sfx.gain.value=.7; AU.sfx.connect(AU.master);
    AU.nextT=c.currentTime+.1;
    setInterval(schedule,40);
  }catch(e){AU.c=null}
}
function nf(n){const m=/^([A-G])([#b]?)(\d)$/.exec(n); if(!m) return 0; const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); return 440*Math.pow(2,((+m[3]+1)*12+b-69)/12)}
const SONGS={
  village:{bpm:100,wave:'triangle',vol:.12,lead:'F#5 - A5 - B5 A5 F#5 - E5 - D5 E5 F#5 - - - G5 - B5 - D6 B5 A5 - F#5 - E5 F#5 D5 - - -',chords:[['D4','F#4','A4'],['G3','B3','D4'],['B3','D4','F#4'],['A3','C#4','E4']]},
  forest:{bpm:84,wave:'triangle',vol:.12,lead:'E5 - - G5 A5 - B5 - C6 - B5 A5 G5 - E5 - D5 - - E5 G5 - A5 - G5 - E5 - D5 - - - E5 - - G5 A5 - B5 - D6 - C6 B5 A5 - G5 - A5 - G5 E5 D5 - E5 - A4 - - - - - - -',chords:[['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4'],['E3','G3','B3'],['A3','C4','E4'],['F3','A3','C4'],['D3','F3','A3'],['E3','G#3','B3']]},
  tavern:{bpm:132,wave:'square',vol:.05,perc:true,lead:'G5 B5 D6 B5 G5 B5 A5 F#5 D5 F#5 A5 F#5 D5 E5 F#5 A5 G5 B5 D6 B5 E6 D6 B5 G5 A5 F#5 D5 E5 G5 - G4 -',chords:[['G3','B3','D4'],['D3','F#3','A3'],['C3','E3','G3'],['D3','F#3','A3']]},
  boss:{bpm:150,wave:'sawtooth',vol:.045,perc:true,lead:'D5 D5 F5 D5 A5 - G5 F5 E5 E5 G5 E5 C6 - A5 G5 D5 D5 F5 D5 A5 - A#5 A5 G5 F5 E5 C5 D5 - - -',chords:[['D3','F3','A3'],['C3','E3','G3'],['A#2','D3','F3'],['A2','C#3','E3']]},
  sanctuary:{bpm:70,wave:'sine',vol:.15,lead:'B5 - - - G#5 - E5 - F#5 - - - B4 - - - C#6 - - - B5 - G#5 - A5 - F#5 - E5 - - -',chords:[['E3','G#3','B3'],['C#3','E3','G#3'],['A2','C#3','E3'],['B2','D#3','F#3']]},
  map:{bpm:92,wave:'triangle',vol:.12,lead:'C5 - E5 - G5 - C6 - B5 - G5 - A5 - - - F5 - A5 - C6 - A5 - G5 - E5 - D5 - - -',chords:[['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4']]},
};
for(const k in SONGS) SONGS[k].seq=SONGS[k].lead.split(' ');
function playSong(n){ if(AU.name===n) return; AU.name=n; AU.song=SONGS[n]||null; AU.step=0; if(AU.c) AU.nextT=AU.c.currentTime+.15 }
function voice(f,t,d,type,vol,slow,dest){const c=AU.c,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(slow?.25:.012));g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(dest||AU.bus);o.start(t);o.stop(t+d+.05)}
function noiseAt(t,d,vol,freq,type,dest){const c=AU.c;const len=Math.max(1,Math.floor(c.sampleRate*d));const b=c.createBuffer(1,len,c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t)}
function schedule(){
  const c=AU.c; if(!c||!AU.song) return; const s=AU.song; const sd=60/s.bpm/2;
  while(AU.nextT<c.currentTime+.25){
    const t=AU.nextT, i=AU.step%s.seq.length, n=s.seq[i];
    if(n&&n!=='-') voice(nf(n),t,sd*1.7,s.wave,s.vol);
    if(i%8===0){const ch=s.chords[(i/8|0)%s.chords.length]; ch.forEach(cn=>voice(nf(cn),t,sd*8.5,'sine',.035,true)); voice(nf(ch[0])/2,t,sd*7,'triangle',.09)}
    if(s.perc){ if(i%8===0||i%8===5) noiseAt(t,.12,.18,180,'lowpass',AU.bus); if(i%2===1) noiseAt(t,.04,.05,7000,'highpass',AU.bus) }
    AU.nextT+=sd; AU.step++;
  }
}
function tone(f1,f2,d,type,vol){const c=AU.c;if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+d+.02)}
function sfx(n){
  const c=AU.c; if(!c) return; const t=c.currentTime;
  switch(n){
    case 'slash': noiseAt(t,.12,.22,2500,'highpass'); tone(900,300,.1,'triangle',.06); break;
    case 'hit': noiseAt(t,.08,.3,1200); tone(220,90,.1,'square',.08); break;
    case 'hurt': tone(300,80,.25,'sawtooth',.1); noiseAt(t,.15,.2,800); break;
    case 'fire': noiseAt(t,.35,.2,900); tone(200,500,.25,'sawtooth',.04); break;
    case 'ice': tone(1800,2400,.15,'sine',.06); tone(1200,1600,.2,'triangle',.04); break;
    case 'heal': [0,4,7,12].forEach((s,i)=>voice(523*Math.pow(2,s/12),t+i*.07,.4,'sine',.08,false,AU.sfx)); break;
    case 'boom': noiseAt(t,.4,.35,500); tone(120,40,.4,'sine',.2); break;
    case 'coin': voice(1318,t,.08,'square',.04,false,AU.sfx); voice(1760,t+.07,.14,'square',.04,false,AU.sfx); break;
    case 'item': [0,4,7,11,14].forEach((s,i)=>voice(660*Math.pow(2,s/12),t+i*.08,.35,'triangle',.08,false,AU.sfx)); break;
    case 'level': [0,4,7,12,16,19,24].forEach((s,i)=>voice(392*Math.pow(2,s/12),t+i*.06,.5,'square',.05,false,AU.sfx)); break;
    case 'dash': noiseAt(t,.15,.12,1800,'bandpass'); break;
    case 'puff': noiseAt(t,.25,.12,600); break;
    case 'orb': tone(700,300,.2,'sine',.06); break;
    case 'blip': voice(880,t,.05,'square',.03,false,AU.sfx); break;
    case 'select': voice(660,t,.06,'triangle',.07,false,AU.sfx); voice(990,t+.05,.1,'triangle',.07,false,AU.sfx); break;
    case 'die': tone(400,60,.4,'square',.06); noiseAt(t,.3,.15,1500); break;
    case 'roar': tone(90,50,.9,'sawtooth',.14); noiseAt(t,.9,.2,300); break;
    case 'bloom': [0,7,12,16,19,24,28].forEach((s,i)=>voice(330*Math.pow(2,s/12),t+i*.1,1.2,'sine',.07,false,AU.sfx)); break;
  }
}
function toggleMute(){AU.muted=!AU.muted; if(AU.master) AU.master.gain.value=AU.muted?0:.8; toast(AU.muted?'Som desligado':'Som ligado')}

// ================= painting helpers =================
function ell(g,x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);g.fill()}
function leaf(g,x,y,s,rot,c){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=c;g.beginPath();g.moveTo(0,-s);g.quadraticCurveTo(s*.62,0,0,s*.7);g.quadraticCurveTo(-s*.62,0,0,-s);g.fill();g.restore()}
function starLeaf(g,x,y,s,rot,c){for(let i=0;i<5;i++){const a=rot+i*TAU/5;leaf(g,x+Math.sin(a)*s*.42,y-Math.cos(a)*s*.42,s*.55,a,c)}}
const PAL={
  green:['#123a1c','#1f5a26','#2f8a2c','#5cba2e','#b4e44c'],
  lime:['#1c4a1e','#2d7a26','#4ea62a','#86d23a','#d4f478'],
  teal:['#10332f','#1b5249','#2a7766','#48a585','#9ad8b4'],
  far:['#5c8f86','#6ea39a','#80b5aa','#98c9bb','#b4ddcf'],
  dark:['#0a2010','#123a1b','#1d5424','#2c7430','#4d9a3a'],
  corrupt:['#1e1030','#33194a','#4d2a63','#6e3f7a','#a068a8'],
  night:['#0b1430','#16305a','#22507c','#3a7aa6','#9ad8f0'],
  bloom:['#2a1a40','#4a2a6a','#8a4a9a','#d88ac8','#ffd8f4'],
};
function clump(g,x,y,r,pal,star=true){
  ell(g,x+r*.08,y+r*.12,r,r*.85,pal[0]);
  const L=[[pal[1],1,0,14],[pal[2],.8,.18,12],[pal[3],.58,.34,9],[pal[4],.34,.5,5]];
  for(const [c,sc,off,n] of L){
    const cx=x-r*off*.6, cy=y-r*off*.8, cnt=Math.round(n*Math.max(.6,r/15));
    for(let i=0;i<cnt;i++){
      const a=R()*TAU, d=Math.sqrt(R())*r*sc*.8, px=cx+Math.cos(a)*d, py=cy+Math.sin(a)*d*.8, s=r*rr(.26,.4)*(sc*.5+.5);
      if(star&&R()<.5) starLeaf(g,px,py,s*1.15,R()*TAU,c); else leaf(g,px,py,s,rr(-.8,.8)+(px-x)/r*.8,c);
    }
  }
}
function smooth(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;g.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}const l=pts[pts.length-1];g.lineTo(l[0],l[1])}
function dirt(g,pts,w,cols=['rgba(50,70,20,.35)','#8a7a3e','#a8905a','#bfa66c','#cdb67c']){
  g.lineCap='round';g.lineJoin='round';
  [[w+12,cols[0]],[w+4,cols[1]],[w,cols[2]],[w*.62,cols[3]],[w*.28,cols[4]]].forEach(([lw,c])=>{g.lineWidth=lw;g.strokeStyle=c;smooth(g,pts);g.stroke()});
  for(let i=0;i<160;i++){const k=(R()*(pts.length-1))|0,t=R(),a=pts[k],b=pts[k+1];const x=lerp(a[0],b[0],t),y=lerp(a[1],b[1],t)+rr(-w*.42,w*.42);ell(g,x+rr(-4,4),y,rr(.8,2.2),rr(.6,1.4),R()<.5?'#8a7448':'#e2d098')}
}
function tuft(g,x,y,s,cols){g.lineWidth=1.2;g.lineCap='round';for(let i=0;i<4;i++){g.strokeStyle=pick(cols);g.beginPath();g.moveTo(x+i-2,y);g.quadraticCurveTo(x+i-2+rr(-2,2),y-s*.5,x+(i-1.5)*s*.4+rr(-2,2),y-s*rr(.7,1.1));g.stroke()}}
function rockShape(g,x,y,r,cols=['#34403a','#5f6e64','#8e9c8e','#c2cebe'],moss=true){
  ell(g,x,y+1,r*1.1,r*.35,'rgba(10,20,5,.3)');
  ell(g,x,y-r*.45,r,r*.72,cols[0]); ell(g,x-r*.12,y-r*.55,r*.85,r*.6,cols[1]);
  ell(g,x-r*.28,y-r*.7,r*.5,r*.35,cols[2]); ell(g,x-r*.38,y-r*.8,r*.22,r*.14,cols[3]);
  g.strokeStyle=cols[0];g.lineWidth=1;g.beginPath();g.moveTo(x+r*.2,y-r*.9);g.lineTo(x+r*.05,y-r*.5);g.lineTo(x+r*.3,y-r*.2);g.stroke();
  if(moss) for(let i=0;i<8;i++) ell(g,x+rr(-r*.6,r*.4),y-r*rr(.9,1.1),rr(1.5,3.5),rr(1,2),pick(['#5a9a2e','#7ab83a','#3e7a24']));
}
function mushroom(g,x,y,s,cap='#d8563a',cap2='#9a2e22'){
  ell(g,x,y,s*.9,s*.25,'rgba(10,20,5,.3)');
  g.fillStyle='#efe0c0';g.fillRect(x-s*.28,y-s*1.1,s*.56,s*1.1);g.fillStyle='#c8b48c';g.fillRect(x+s*.08,y-s*1.1,s*.2,s*1.1);
  const gr=g.createLinearGradient(x-s,y-s*1.8,x+s,y-s);gr.addColorStop(0,cap);gr.addColorStop(1,cap2);
  g.fillStyle=gr;g.beginPath();g.ellipse(x,y-s*1.1,s,s*.8,0,Math.PI,0);g.fill();ell(g,x,y-s*1.1,s*.95,s*.18,'#c8a888');
  for(let i=0;i<4;i++) ell(g,x+rr(-s*.6,s*.6),y-s*rr(1.3,1.7),s*rr(.1,.16),s*rr(.08,.12),'#fff4e0');
}
function flower(g,x,y,s,c,c2){for(let i=0;i<5;i++){const a=i*TAU/5+.3;leaf(g,x+Math.sin(a)*s*.55,y-Math.cos(a)*s*.55,s*.6,a,c)}ell(g,x,y,s*.25,s*.25,c2)}
function fern(g,x,y,s,cols){for(let f=0;f<5;f++){const a=-1.3+f*.65+rr(-.15,.15);const ex=x+Math.sin(a)*s,ey=y-Math.cos(a)*s*.8;g.strokeStyle=cols[0];g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.sin(a)*s*.5,y-s*.7,ex,ey);g.stroke();for(let k=1;k<6;k++){const t=k/6;const px=lerp(x,ex,t),py=lerp(y,ey,t)-Math.sin(t*Math.PI)*s*.15;leaf(g,px,py,s*.14*(1.2-t*.6),a-1.2,cols[1+(k%2)]);leaf(g,px,py,s*.14*(1.2-t*.6),a+1.2,cols[1+((k+1)%2)])}}}
function glow(g,x,y,r,c){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function trunk(g,x,base,w,h,cols=['#2d2a1c','#5a5a34','#8e8c52','#b8b474']){
  const top=base-h;
  g.lineCap='round';
  for(let i=0;i<3;i++){g.strokeStyle=cols[1];g.lineWidth=w*rr(.25,.42);g.beginPath();const sx=x+rr(-w*.3,w*.3),sy=top+rr(8,h*.3),d=R()<.5?-1:1;g.moveTo(sx,sy);g.quadraticCurveTo(sx+d*w*1.4,sy-8,sx+d*w*rr(2,3.4),sy-rr(20,40));g.stroke()}
  g.beginPath();g.moveTo(x-w*1.5,base+5);g.quadraticCurveTo(x-w*.7,base-6,x-w*.55,base-h*.3);g.bezierCurveTo(x-w*.45,base-h*.6,x-w*.7,top+10,x-w*1.1,top);
  g.lineTo(x+w*1.1,top);g.bezierCurveTo(x+w*.7,top+10,x+w*.45,base-h*.6,x+w*.55,base-h*.3);g.quadraticCurveTo(x+w*.7,base-6,x+w*1.6,base+5);g.closePath();
  const gr=g.createLinearGradient(x-w,0,x+w,0);gr.addColorStop(0,cols[2]);gr.addColorStop(.3,cols[3]);gr.addColorStop(.62,cols[1]);gr.addColorStop(1,cols[0]);g.fillStyle=gr;g.fill();

function wrap(text,maxW,font){ctx.save();ctx.font=font;const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);ctx.restore();return lines}
function updateDialog(dt){
  const total=D.cur.t.length;D.shown=Math.min(total,D.shown+dt*55);
  if(D.cur.ch&&D.shown>=total){if(PR.up){D.sel=(D.sel+D.cur.ch.length-1)%D.cur.ch.length;sfx('blip')}if(PR.down){D.sel=(D.sel+1)%D.cur.ch.length;sfx('blip')}}
  if(PR.ok||PR.attack){
    if(D.shown<total){D.shown=total}
    else if(D.cur.ch){const c=D.cur.ch[D.sel];D.q=[];D.cur=null;D.done=null;sfx('select');c.f()}

}

  if(id==='map'){G.state='map';if(!MAP_BASE){MAP_BASE=paintMapBase();for(const k in LANDS)MINIS[k]=paintMini(k)}const land=G.map.here||'village';const p=G.lands[land]||[1,1];G.map.c=p[0];G.map.r=p[1];G.map.msg='';playSong('map');save();return}
  const s=SC[id];G.scene=s;G.sid=id;G.state='play';
  if(!s.art){s.art=s.paint();s.propList=s.props?s.props():[]}
  hero.x=sx;hero.y=sy;hero.dir=dir||'down';hero.kx=hero.ky=0;hero.dashT=0;hero.atkT=0;hero.trail=[];
  G.map.here=s.land;G.exitCD=.5;
  if(s.spawn)s.spawn();
  playSong(G.boss?'boss':s.music);
  G.banner={t:0,text:s.name};
  save();
}
function spawnAt(type,cor){
  const s=G.scene,[x0,x1,y0,y1]=s.bounds;
  for(let tries=0;tries<40;tries++){const x=rnd(x0+40,x1-40),y=rnd(y0+10,y1-10);if(dist(x,y,hero.x,hero.y)<150)continue;if(s.propList.some(p=>p.r&&dist(x,y,p.x,p.y)<p.r+14))continue;spawnEnemy(type,x,y,cor);return}
}
const EN={sprout:{hp:20,r:8,h:14,dmg:6,xp:6,gold:[1,4]},shroom:{hp:34,r:10,h:22,dmg:7,xp:10,gold:[2,6]},wisp:{hp:28,r:9,h:26,dmg:8,xp:13,gold:[3,8]}};
function spawnEnemy(type,x,y,cor){const b=EN[type],m=cor?1.35:1;G.enemies.push({type,x,y,hp:b.hp*m,max:b.hp*m,r:b.r,h:b.h,dmg:Math.round(b.dmg*m),xp:Math.round(b.xp*m),gold:b.gold,cor:!!cor,t:rnd(0,2),kx:0,ky:0,flash:0,slow:0,z:0,vx:0,vy:0,hop:0,seed:rnd(0,10),frame:0,state:'walk',st:0,cd:rnd(.8,2.5),orb:Math.random()<.5?1:-1,spawnT:.4})}
function spawnBoss(){if(!BOSS_IMG)BOSS_IMG=paintBoss();G.boss={x:320,y:236,hp:380,max:380,t:0,cd:2.2,phase:1,flash:0,state:'idle',st:0,stMax:1,armT:.9,dead:false,deathT:0,intro:1.6};G.scene.exitsLocked=true}

// ================= combat =================
const DIRV={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]};
function part(x,y,o){if(G.parts.length>600)return;G.parts.push(Object.assign({x,y,vx:0,vy:0,life:.5,max:.5,c:'#fff',s:2,g:0,add:false,drag:1},o))}
function burst(x,y,n,cols,sp=80,life=.5,s=2,add=false,g=0){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(sp*.3,sp);const l=rnd(life*.6,life);part(x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,c:cols[(Math.random()*cols.length)|0],s:rnd(s*.6,s*1.3),add,g,drag:.9})}}
function ftext(x,y,t,c,size=12){G.texts.push({x,y,t:String(t),c,size,life:.9,vy:-38})}
function aimVec(){
  let [fx,fy]=DIRV[hero.dir];let best=null,bd=1e9;
  const targets=G.enemies.map(e=>({x:e.x,y:e.y-e.h*.5}));if(G.boss&&!G.boss.dead)targets.push({x:G.boss.x,y:G.boss.y-60});
  for(const t of targets){const dx=t.x-hero.x,dy=t.y-(hero.y-10),d=Math.hypot(dx,dy);if(d>230)continue;const dot=(dx*fx+dy*fy)/d;if(dot>.55&&d<bd){bd=d;best=[dx/d,dy/d]}}
  return best||[fx,fy];
}
function doAttack(){
  const h=hero;if(h.atkT>.1||h.dashT>0)return;
  h.combo=h.comboT>0?(h.combo%3)+1:1;h.comboT=.6;h.atkT=.26;sfx('slash');
  const [fx,fy]=DIRV[h.dir],big=h.combo===3,reach=big?38:31;
  h.kx+=fx*60;h.ky+=fy*60;
  G.slashes.push({x:h.x,y:h.y-12,fx,fy,t:0,big,flip:h.combo===2});
  const ax=h.x+fx*16,ay=h.y-10+fy*12;
  for(const e of G.enemies){if(dist(ax,ay,e.x,e.y-e.h*.5)<reach+e.r){damageEnemy(e,h.atk*rnd(.9,1.1)*(big?1.6:1),fx*(big?280:170),fy*(big?280:170),'#fff')}}
  const b=G.boss;if(b&&!b.dead&&b.intro<=0&&dist(ax,ay,b.x,b.y-40)<reach+44)damageBoss(h.atk*rnd(.9,1.1)*(big?1.6:1),'#fff');
}
function castSpell(){
  const h=hero,id=h.spells[h.spell],sp=SPELLS[id];if(h.castT>0||h.dashT>0)return;
  if(h.mp<sp.cost){ftext(h.x,h.y-40,'Sem mana','#8ab8ff',11);sfx('blip');h.castT=.3;return}
  h.mp-=sp.cost;h.castT=.38;h.atkT=.2;
  const [ax,ay]=aimVec();
  if(ax!==0||ay!==0){if(Math.abs(ax)>Math.abs(ay))h.dir=ax>0?'right':'left';else h.dir=ay>0?'down':'up'}
  const sx=h.x+ax*12,sy=h.y-14+ay*8;
  if(id==='fire'){G.projs.push({x:sx,y:sy,vx:ax*230,vy:ay*230,r:7,dmg:h.mag*1.6,own:'h',kind:'fire',life:1.1});sfx('fire')}
  else if(id==='ice'){const a=Math.atan2(ay,ax);for(const o of[-.26,0,.26])G.projs.push({x:sx,y:sy,vx:Math.cos(a+o)*270,vy:Math.sin(a+o)*270,r:5,dmg:h.mag*.75,own:'h',kind:'ice',life:.8,rot:a+o});sfx('ice')}
  else if(id==='heal'){const amt=Math.round(20+h.mag*1.5);h.hp=Math.min(h.maxhp,h.hp+amt);ftext(h.x,h.y-44,'+'+amt,'#8aff8a',13);sfx('heal');for(let i=0;i<24;i++){const a=i/24*TAU;part(h.x+Math.cos(a)*18,h.y-10+Math.sin(a)*8,{vy:rnd(-50,-20),life:.9,max:.9,c:pick2(['#b0ffb0','#f0fff0','#7ae07a']),s:2,add:true})}}
  burst(sx,sy,8,[sp.col,'#fff'],50,.3,2,true);
}
function drinkPotion(){const h=hero;if(h.potions<=0){toast('Sem poções');return}if(h.hp>=h.maxhp){toast('Vida já está cheia');return}h.potions--;const amt=40;h.hp=Math.min(h.maxhp,h.hp+amt);ftext(h.x,h.y-44,'+'+amt,'#ff8aa0',13);sfx('heal');burst(h.x,h.y-16,14,['#ff9ab0','#fff'],60,.6,2,true)}
function damageEnemy(e,amt,kx,ky,col){
  amt=Math.round(amt);e.hp-=amt;e.flash=.13;e.kx=kx;e.ky=ky;G.hitstop=Math.max(G.hitstop,.045);G.shake=Math.max(G.shake,2);
  ftext(e.x+rnd(-4,4),e.y-e.h-8,amt,col||'#fff');sfx('hit');burst(e.x,e.y-e.h*.5,6,['#fff','#ffe08a'],90,.25,2,true);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;sfx('die');burst(e.x,e.y-e.h*.5,18,e.type==='wisp'?['#a0d8ff','#fff']:e.type==='shroom'?['#f06a4a','#fff4e0','#f0dcb8']:e.cor?['#b070d0','#ecc8ff']:['#f2cc3a','#fff2a8','#86d23a'],110,.6,2.5,false,120);
  gainXP(e.xp);const n=((Math.random()*(e.gold[1]-e.gold[0]+1))|0)+e.gold[0];
  for(let i=0;i<Math.min(n,4);i++)drop(e.x,e.y,'coin',Math.ceil(n/Math.min(n,4)));
  if(Math.random()<.18)drop(e.x,e.y,'heart');else if(Math.random()<.18)drop(e.x,e.y,'mana');
}
function drop(x,y,kind,v=0){G.drops.push({x:x+rnd(-8,8),y:y+rnd(-5,5),kind,v,t:0,life:14,vz:rnd(60,100),z:0})}
function gainXP(n){const h=hero;h.xp+=n;while(h.xp>=xpNext(h.lvl)){h.xp-=xpNext(h.lvl);h.lvl++;h.maxhp+=8;h.maxmp+=4;h.atk+=2;h.mag+=2;h.hp=h.maxhp;h.mp=h.maxmp;sfx('level');ftext(h.x,h.y-50,'NÍVEL '+h.lvl+'!','#ffe07a',15);for(let i=0;i<30;i++){const a=i/30*TAU;part(h.x,h.y-14,{vx:Math.cos(a)*90,vy:Math.sin(a)*50,life:.8,max:.8,c:pick2(['#ffe07a','#fff']),s:2.5,add:true,drag:.92})}}}
function hurtHero(dmg,sx,sy){
  const h=hero;if(h.inv>0||h.dashT>0||G.state!=='play'||D.cur)return;
  h.hp-=dmg;h.inv=1;const dx=h.x-sx,dy=h.y-sy,d=Math.hypot(dx,dy)||1;h.kx=dx/d*200;h.ky=dy/d*200;
  G.shake=6;G.hitstop=.06;ftext(h.x,h.y-44,dmg,'#ff6a5a',13);sfx('hurt');burst(h.x,h.y-16,10,['#ff6a5a','#fff'],90,.35,2);
  if(h.hp<=0){h.hp=0;G.state='gameover';G.endT=0;playSong('');}
}
function damageBoss(amt,col,fire){
  const b=G.boss;amt=Math.round(amt*(fire?1.5:1));b.hp-=amt;b.flash=.12;G.hitstop=Math.max(G.hitstop,.04);G.shake=Math.max(G.shake,2);
  ftext(b.x+rnd(-24,24),b.y-110+rnd(-10,10),amt+(fire?'!':''),fire?'#ffb05a':col,fire?15:13);sfx('hit');burst(b.x+rnd(-20,20),b.y-60+rnd(-20,20),6,['#fff','#c890e0'],90,.3,2,true);
  if(b.phase===1&&b.hp<b.max*.5){b.phase=2;sfx('roar');G.shake=10;toast('O Carvalho Ancião enfurece!');for(let i=0;i<3;i++)spawnEnemy('sprout',b.x+rnd(-90,90),b.y+rnd(30,60),true)}
  if(b.hp<=0&&!b.dead){b.dead=true;b.deathT=0;G.projs=G.projs.filter(p=>p.own==='h');G.hazards=[];G.enemies.forEach(e=>{e.hp=0;killEnemy(e)});G.enemies=[];playSong('');sfx('roar')}
}
function explode(p){
  sfx('boom');G.shake=Math.max(G.shake,4);burst(p.x,p.y,26,['#ffdf6a','#ff8a3a','#ff4a2a','#fff'],130,.5,3,true);
  for(const e of G.enemies)if(!e.dead&&dist(p.x,p.y,e.x,e.y-e.h*.5)<30+e.r){const d=Math.hypot(e.x-p.x,e.y-p.y)||1;damageEnemy(e,p.dmg,(e.x-p.x)/d*200,(e.y-p.y)/d*200,'#ffb05a')}
  const b=G.boss;if(b&&!b.dead&&b.intro<=0&&dist(p.x,p.y,b.x,b.y-50)<60)damageBoss(p.dmg,'#ffb05a',true);
}

// ================= updates =================
function collide(e,r,isHero){
  const s=G.scene;
  for(const o of s.solids){if(o.r){circ(e,o.x,o.y,o.r+r)}else rectPush(e,o,r)}
  for(const p of s.propList){if(p.r)circ(e,p.x,p.y-3,p.r+r);else if(p.rect)rectPush(e,p.rect,r)}
  for(const n of s.npcs)if(!n.nosolid)circ(e,n.x,n.y,8+r);
  if(G.boss&&!G.boss.dead)circ(e,G.boss.x,G.boss.y-8,38+r);
  const [x0,x1,y0,y1]=s.bounds;e.x=clamp(e.x,x0,x1);e.y=clamp(e.y,y0,y1);
}
function circ(e,x,y,m){const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d<m){if(d>.01){e.x=x+dx/d*m;e.y=y+dy/d*m}else e.y=y+m}}
function rectPush(e,s,r){const cx=clamp(e.x,s.x,s.x+s.w),cy=clamp(e.y,s.y,s.y+s.h);const dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);if(d>=r)return;if(d>0){e.x=cx+dx/d*r;e.y=cy+dy/d*r}else{const l=e.x-s.x,rt=s.x+s.w-e.x,t=e.y-s.y,b=s.y+s.h-e.y,m=Math.min(l,rt,t,b);if(m===l)e.x=s.x-r;else if(m===rt)e.x=s.x+s.w+r;else if(m===t)e.y=s.y-r;else e.y=s.y+s.h+r}}
function nearestTalk(){
  const s=G.scene;let best=null,bd=1e9;
  for(const n of s.npcs){const x=n.ix??n.x,y=n.iy??n.y,r=n.ir||30;const d=dist(hero.x,hero.y,x,y);if(d<r&&d<bd){bd=d;best=n}}
  for(const o of s.objs){const d=dist(hero.x,hero.y,o.x,o.y);if(d<o.r&&d<bd){bd=d;best=o}}
  return best;
}
function updateHero(dt){
  const h=hero;
  h.inv=Math.max(0,h.inv-dt);h.atkT-=dt;h.dashCD-=dt;h.castT-=dt;h.comboT-=dt;
  h.mp=Math.min(h.maxmp,h.mp+dt*1.3);
  let ix=(K.right?1:0)-(K.left?1:0),iy=(K.down?1:0)-(K.up?1:0);
  if(joy.active&&Math.hypot(joy.x,joy.y)>.2){ix=joy.x;iy=joy.y}
  let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len;len=1}
  h.moving=false;
  if(h.dashT>0){h.dashT-=dt;h.x+=h.dvx*dt;h.y+=h.dvy*dt;h.trail.push({x:h.x,y:h.y,dir:h.dir,life:.25});if(Math.random()<.6)part(h.x+rnd(-4,4),h.y,{vy:-10,life:.4,max:.4,c:'rgba(230,220,180,.7)',s:3})}
  else if(h.atkT<=0&&h.castT<=.15){
    if(len>.15){h.moving=true;h.x+=ix*96*dt;h.y+=iy*96*dt;h.walk+=dt*9;if(Math.abs(ix)>Math.abs(iy)*.9)h.dir=ix>0?'right':'left';else h.dir=iy>0?'down':'up'}
    else h.walk=0;
  }
  h.x+=h.kx*dt;h.y+=h.ky*dt;const damp=Math.pow(.0008,dt);h.kx*=damp;h.ky*=damp;
  collide(h,7,true);
  h.trail=h.trail.filter(t=>(t.life-=dt)>0);
  if(D.cur)return;
  if(PR.ok){const n=nearestTalk();if(n){if(n.look){const dx=hero.x-n.x,dy=hero.y-n.y;n.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}n.talk();return}else doAttack()}
  if(PR.attack)doAttack();
  if(PR.magic)castSpell();
  if(PR.dash&&h.dashCD<=0&&h.atkT<=0){let dx=ix,dy=iy;if(len<.15){[dx,dy]=DIRV[h.dir]}const l=Math.hypot(dx,dy)||1;h.dvx=dx/l*280;h.dvy=dy/l*280;h.dashT=.18;h.dashCD=.5;sfx('dash')}
  if(PR.next&&h.spells.length>1){h.spell=(h.spell+1)%h.spells.length;sfx('blip')}
  if(PR.prev&&h.spells.length>1){h.spell=(h.spell+h.spells.length-1)%h.spells.length;sfx('blip')}
  if(PR.potion)drinkPotion();
  // exits
  G.exitCD-=dt;
  if(G.exitCD<=0&&!(G.scene.exitsLocked&&G.boss&&!G.boss.dead)){for(const x of G.scene.exits){if(h.x>=x.x&&h.x<=x.x+x.w&&h.y>=x.y&&h.y<=x.y+x.h){goScene(x.to,x.sx,x.sy,x.dir);break}}}
}
function updateEnemy(e,dt){
  const h=hero;e.t+=dt;e.flash-=dt;e.slow-=dt;if(e.spawnT>0){e.spawnT-=dt;return}
  const sp=e.slow>0?.45:1,dx=h.x-e.x,dy=h.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.type==='sprout'){
    e.cd-=dt*sp;
    if(e.hop>0){e.hop-=dt*sp;e.x+=e.vx*dt*sp;e.y+=e.vy*dt*sp;e.z=Math.sin((1-Math.max(0,e.hop)/.42)*Math.PI)*10;e.frame=2}
    else{e.z=0;e.frame=e.cd<.18?1:0;if(e.cd<=0){e.hop=.42;e.cd=rnd(.45,1.05);const chase=d<180,a=chase?Math.atan2(dy,dx)+rnd(-.35,.35):rnd(0,TAU),s=chase?(e.cor?100:82):40;e.vx=Math.cos(a)*s;e.vy=Math.sin(a)*s}}
  }else if(e.type==='shroom'){
    e.cd-=dt*sp;
    if(e.state==='puff'){e.st-=dt;e.frame=0;if(e.st<=0){e.state='walk';for(let i=0;i<8;i++){const a=i/8*TAU+e.t;G.projs.push({x:e.x,y:e.y-12,vx:Math.cos(a)*62,vy:Math.sin(a)*62,r:5,dmg:5,own:'e',kind:'spore',life:2.2})}sfx('puff')}}
    else{if(d<240){e.x+=dx/d*24*sp*dt;e.y+=dy/d*24*sp*dt}e.frame=Math.floor(e.t*6)%4;if(e.cd<=0&&d<210){e.cd=rnd(2.6,3.6);e.state='puff';e.st=.55}}
  }else if(e.type==='wisp'){
    const want=120,rad=(d-want)/d;e.x+=(-dy/d*42*e.orb+dx*rad*1.1)*dt*sp;e.y+=(dx/d*42*e.orb+dy*rad*1.1)*dt*sp;
    e.cd-=dt*sp;if(e.cd<=0){e.cd=rnd(1.8,2.6);const a=Math.atan2(dy+10,dx);G.projs.push({x:e.x,y:e.y-22,vx:Math.cos(a)*120,vy:Math.sin(a)*120,r:5,dmg:8,own:'e',kind:'orb',life:3});sfx('orb')}
    if(Math.random()<.3)part(e.x+rnd(-4,4),e.y-20,{vy:-20,life:.5,max:.5,c:'#a0d8ff',s:2,add:true});
  }
  e.x+=e.kx*dt;e.y+=e.ky*dt;const damp=Math.pow(.002,dt);e.kx*=damp;e.ky*=damp;
  collide(e,e.r);
  if(d<e.r+8&&e.z<6)hurtHero(e.dmg,e.x,e.y);
}
function updateBoss(b,dt){
  b.t+=dt;b.flash-=dt;
  if(b.dead){b.deathT+=dt;if(Math.random()<.5)burst(b.x+rnd(-60,60),b.y-rnd(10,150),6,['#fff','#e0b0ff','#ffe8a0'],80,.6,2.5,true);G.shake=3;
    if(b.deathT>2.6){G.boss=null;G.flags.bossDefeated=1;G.scene.exitsLocked=false;gainXP(160);hero.gold+=60;playSong('forest');
      say([{n:'',t:'A sombra se dissolve em luz. O Carvalho Ancião volta a dormir em paz, e algo cintilante cai de seus galhos.'}],()=>{giveArtifact('tear')});}
    return}
  if(b.intro>0){b.intro-=dt;if(b.intro<=0){toast('Carvalho Ancião Corrompido');sfx('roar');G.shake=8}return}
  const h=hero,dx=h.x-b.x,dy=h.y-b.y,d=Math.hypot(dx,dy);
  const rate=b.phase===2?1.45:1;
  if(b.state==='wind'){b.st-=dt;b.armT=lerp(.9,2.6,1-b.st/b.stMax);if(b.st<=0){b.state='sweep';b.st=.35;G.shake=9;sfx('boom');burst(b.x,b.y+10,30,['#8a6a52','#c8b08a','#5a9a2e'],160,.6,3,false,200);if(Math.abs(dx)<110&&dy>-30&&dy<90)hurtHero(b.phase===2?16:12,b.x,b.y-40)}return}
  if(b.state==='sweep'){b.st-=dt;b.armT=lerp(b.armT,.25,dt*20);if(b.st<=0){b.state='idle'}return}
  b.armT=lerp(b.armT,.9,dt*4);
  b.cd-=dt*rate;
  if(b.cd<=0){
    if(d<100){b.state='wind';b.st=b.stMax=b.phase===2?.55:.75;b.cd=1.6}
    else{const r=Math.random(),alive=G.enemies.length;
      if(r<.4){const n=b.phase===2?13:9,base=Math.atan2(dy+10,dx);for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.16;G.projs.push({x:b.x,y:b.y-70,vx:Math.cos(a)*125,vy:Math.sin(a)*125,r:5,dmg:8,own:'e',kind:'thorn',life:3.4,rot:a})}sfx('orb');b.cd=2}
      else if(r<.8||alive>=3){const n=b.phase===2?5:3;for(let i=0;i<n;i++){const ox=i===0?0:rnd(-60,60),oy=i===0?0:rnd(-35,35);G.hazards.push({x:clamp(h.x+ox,30,610),y:clamp(h.y+oy,220,330),t:0,warn:.85,act:.4,hit:false})}b.cd=2.3}
      else{for(let i=0;i<2;i++)spawnEnemy('sprout',b.x+rnd(-80,80),b.y+rnd(30,50),true);burst(b.x,b.y+30,20,['#b070d0','#ecc8ff'],80,.5,2,true);b.cd=2.2}
    }
  }
}
function updateWorld(dt){
  updateHero(dt);
  for(const e of G.enemies)updateEnemy(e,dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.boss)updateBoss(G.boss,dt);
  for(const p of G.projs){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.kind==='fire'&&Math.random()<.9)part(p.x+rnd(-3,3),p.y+rnd(-3,3),{vx:-p.vx*.1,vy:-p.vy*.1-10,life:.35,max:.35,c:pick2(['#ffdf6a','#ff8a3a','#ff5a2a']),s:rnd(2,4),add:true});
    if(p.kind==='ice'&&Math.random()<.5)part(p.x,p.y,{life:.3,max:.3,c:'#d8f4ff',s:1.5,add:true});
    if(p.own==='h'){
      for(const e of G.enemies){if(!e.dead&&e.spawnT<=0&&dist(p.x,p.y,e.x,e.y-e.h*.5)<p.r+e.r){if(p.kind!=='fire'){damageEnemy(e,p.dmg,p.vx*.6,p.vy*.6,'#bfe8ff');e.slow=2.2;burst(p.x,p.y,8,['#d8f4ff','#8ad8ff'],60,.3,2,true)}p.life=0;break}}
      const b=G.boss;if(p.life>0&&b&&!b.dead&&b.intro<=0&&dist(p.x,p.y,b.x,b.y-60)<p.r+46){if(p.kind!=='fire'){damageBoss(p.dmg,'#bfe8ff');burst(p.x,p.y,8,['#d8f4ff','#8ad8ff'],60,.3,2,true)}p.life=0}
      if(p.life<=0&&p.kind==='fire'&&!p.boomed){p.boomed=1;explode(p)}
    }else if(dist(p.x,p.y,hero.x,hero.y-12)<p.r+7){hurtHero(p.dmg,p.x,p.y);if(hero.dashT<=0)p.life=0}
    if(p.x<-20||p.x>W+20||p.y<100||p.y>H+20)p.life=0;
  }
  G.projs=G.projs.filter(p=>p.life>0);
  for(const z of G.hazards){z.t+=dt;if(z.t>z.warn&&z.t<z.warn+z.act){if(!z.burst){z.burst=1;burst(z.x,z.y,10,['#6a4a3a','#a08060','#b070d0'],90,.4,2,false,160);sfx('hit')}if(!z.hit&&dist(z.x,z.y,hero.x,hero.y)<18){z.hit=true;hurtHero(G.boss&&G.boss.phase===2?13:10,z.x,z.y+10)}}}
  G.hazards=G.hazards.filter(z=>z.t<z.warn+z.act+.2);
  for(const d of G.drops){d.t+=dt;d.life-=dt;d.vz-=260*dt;d.z=Math.max(0,d.z+d.vz*dt);if(d.z===0)d.vz=0;const dd=dist(d.x,d.y,hero.x,hero.y);if(dd<56&&d.t>.4){d.x+=(hero.x-d.x)*dt*7;d.y+=(hero.y-d.y)*dt*7}
    if(dd<11&&d.t>.4){d.life=0;if(d.kind==='coin'){hero.gold+=d.v;sfx('coin');ftext(d.x,d.y-14,'+'+d.v,'#ffe07a',10)}else if(d.kind==='heart'){hero.hp=Math.min(hero.maxhp,hero.hp+15);sfx('heal');ftext(d.x,d.y-14,'+15','#ff8aa0',10)}else{hero.mp=Math.min(hero.maxmp,hero.mp+10);sfx('heal');ftext(d.x,d.y-14,'+10','#8ab8ff',10)}}}
  G.drops=G.drops.filter(d=>d.life>0);
  for(const s of G.slashes)s.t+=dt;G.slashes=G.slashes.filter(s=>s.t<.2);
}
function updateFx(dt){
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;const dr=Math.pow(p.drag,dt*60);p.vx*=dr;p.vy*=dr;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y+=t.vy*dt;t.vy*=Math.pow(.05,dt);t.life-=dt}G.texts=G.texts.filter(t=>t.life>0);
  for(const t of G.toasts)t.life-=dt;G.toasts=G.toasts.filter(t=>t.life>0);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>3.2)G.banner=null}
  G.shake=Math.max(0,G.shake-dt*20);
  updateAmb(dt);
}
function ambKind(){if(G.state==='title')return'forest';if(G.state==='map')return'map';return G.scene?G.scene.amb:'forest'}
function updateAmb(dt){
  const k=ambKind(),target={forest:34,village:14,tavern:26,sanctuary:40,map:20}[k]||0;
  while(G.amb.length<target){const a={k,x:rnd(0,W),y:rnd(0,H),t:rnd(0,10),vx:0,vy:0,s:rnd(.6,1.4)};
    if(k==='forest'){a.leaf=Math.random()<.35;if(a.leaf){a.y=rnd(-20,80);a.vy=rnd(12,24);a.vx=rnd(-8,8)}else a.y=rnd(180,340)}
    if(k==='village'){a.y=rnd(200,330)}
    if(k==='tavern'){a.x=rnd(60,590);a.y=rnd(30,330)}
    if(k==='sanctuary'){a.petal=Math.random()<.5;if(a.petal){a.y=rnd(-20,100);a.vy=rnd(10,20)}else{a.y=rnd(220,360);a.vy=rnd(-14,-6)}}
    G.amb.push(a)}
  for(const a of G.amb){a.t+=dt;
    if(a.k==='forest'){if(a.leaf){a.x+=(a.vx+Math.sin(a.t*1.3)*14)*dt;a.y+=a.vy*dt;if(a.y>360)a.dead=1}else{a.x+=Math.sin(a.t*.7+a.s)*12*dt;a.y+=Math.cos(a.t*.9)*8*dt}}
    else if(a.k==='village'){a.x+=Math.sin(a.t*.5)*20*dt+10*dt;a.y+=Math.cos(a.t*1.7)*16*dt;if(a.x>W+10)a.x=-10}
    else if(a.k==='tavern'){a.y+=Math.sin(a.t*.4)*3*dt;a.x+=Math.cos(a.t*.3)*3*dt}
    else if(a.k==='sanctuary'){a.y+=a.vy*dt;a.x+=Math.sin(a.t)*10*dt;if(a.y>370||a.y<-30)a.dead=1}
    else if(a.k==='map'){if(a.t>3)a.dead=1}
    if(a.k!==k)a.dead=1}
  G.amb=G.amb.filter(a=>!a.dead);
}

// ================= render helpers =================
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function panel(x,y,w,h,a=.93){ctx.save();rrect(x,y,w,h,7);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,`rgba(44,30,18,${a})`);g.addColorStop(1,`rgba(22,15,10,${a})`);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#c9a05a';ctx.stroke();rrect(x+3.5,y+3.5,w-7,h-7,5);ctx.lineWidth=1;ctx.strokeStyle='rgba(255,226,160,.18)';ctx.stroke();[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy])=>{ctx.fillStyle='#e8c46a';ctx.beginPath();ctx.moveTo(cx,cy-4);ctx.lineTo(cx+4,cy);ctx.lineTo(cx,cy+4);ctx.lineTo(cx-4,cy);ctx.fill()});ctx.restore()}
function txt(t,x,y,font,col,align='left',outline=null){ctx.font=font;ctx.textAlign=align;ctx.textBaseline='alphabetic';if(outline){ctx.lineWidth=3;ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=col;ctx.fillText(t,x,y)}
function shadow(x,y,rx){ctx.fillStyle='rgba(15,25,5,.32)';ctx.beginPath();ctx.ellipse(x,y,rx,rx*.38,0,0,TAU);ctx.fill()}
function drawSpr(s,x,y,flash,alpha=1){ctx.globalAlpha=alpha;ctx.drawImage(flash?s.flash:s.img,Math.round(x-21),Math.round(y-51));ctx.globalAlpha=1}
function drawHeroAt(x,y,dir,frame,atk,alpha=1,flash=false){drawSpr(humanSprite('hero',dir,frame,atk),x,y,flash,alpha)}
function heroFrame(){return hero.moving?Math.floor(hero.walk)%4:0}

function drawSlash(s){
  const k=s.t/.2,a0=Math.atan2(s.fy,s.fx),sw=s.big?1.9:1.5,r=s.big?30:24;
  const from=s.flip?a0+sw/2:a0-sw/2,to=s.flip?a0-sw/2:a0+sw/2,cur=lerp(from,to,Math.min(1,k*1.6));
  ctx.save();ctx.translate(s.x,s.y);ctx.globalCompositeOperation='lighter';
  const a1=Math.min(from,cur),a2=Math.max(from,cur);
  ctx.globalAlpha=1-k;ctx.fillStyle=s.big?'rgba(255,220,140,.85)':'rgba(255,250,230,.8)';
  ctx.beginPath();ctx.arc(0,0,r,a1,a2);ctx.arc(0,0,r*.55,a2,a1,true);ctx.fill();
  ctx.globalAlpha=(1-k)*.5;ctx.fillStyle='#ffe8a0';ctx.beginPath();ctx.arc(0,0,r+3,a1,a2);ctx.arc(0,0,r-2,a2,a1,true);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(cur);ctx.globalAlpha=1-k*.6;ctx.fillStyle='#e8eef8';ctx.fillRect(6,-1.5,r-2,3);ctx.fillStyle='#8a94a8';ctx.fillRect(6,.5,r-2,1);ctx.fillStyle='#c8a040';ctx.fillRect(3,-3,3,6);ctx.restore();
}
function drawEnemy(e){
  const fl=e.flash>0;
  if(e.spawnT>0){ctx.globalAlpha=1-e.spawnT/.4}
  if(e.type==='wisp'){drawWisp(e,fl);ctx.globalAlpha=1;return}
  shadow(e.x,e.y,e.r*(1-e.z/30));
  const s=e.type==='sprout'?sprite(`sp${e.frame}${e.cor?1:0}`,g=>paintSprout(g,e.frame,e.cor)):sprite(`sh${e.state==='puff'?4:e.frame}`,g=>{if(e.state==='puff'){g.save();g.translate(20,50);g.scale(1.15,.9);g.translate(-20,-50);paintShroom(g,0);g.restore()}else paintShroom(g,e.frame)});
  drawSpr(s,e.x,e.y-e.z,fl);
  if(e.slow>0){ctx.globalAlpha=.35;ctx.fillStyle='#8ad8ff';ctx.fillRect(e.x-10,e.y-e.h-e.z,20,e.h);ctx.globalAlpha=1}
  ctx.globalAlpha=1;
  if(e.hp<e.max){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-11,e.y+4,22,3);ctx.fillStyle='#ff6a4a';ctx.fillRect(e.x-10.5,e.y+4.5,21*Math.max(0,e.hp/e.max),2)}
}
function drawWisp(e,fl){
  const x=e.x,y=e.y-22+Math.sin(G.t*3+e.seed)*3;
  shadow(e.x,e.y,7);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y,0,x,y,24);g.addColorStop(0,'rgba(140,200,255,.55)');g.addColorStop(1,'rgba(140,200,255,0)');ctx.fillStyle=g;ctx.fillRect(x-24,y-24,48,48);
  for(let i=0;i<5;i++){const k=i/5;ell(ctx,x+Math.sin(G.t*8+i+e.seed)*2,y-k*12,9*(1-k*.7),10*(1-k*.6),fl?'#ffffff':i<2?'#6aa8ff':'#c8e8ff')}
  ctx.restore();
  ell(ctx,x-3,y+1,1.6,2.4,'#101830');ell(ctx,x+3,y+1,1.6,2.4,'#101830');
  if(e.slow>0){ctx.globalAlpha=.4;ell(ctx,x,y,10,10,'#d8f4ff');ctx.globalAlpha=1}
  if(e.hp<e.max){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-11,e.y+4,22,3);ctx.fillStyle='#ff6a4a';ctx.fillRect(e.x-10.5,e.y+4.5,21*Math.max(0,e.hp/e.max),2)}
}
function drawBoss(b){
  const x=b.x,y=b.y;const alpha=b.dead?Math.max(0,1-b.deathT/2.4):1;const rise=b.intro>0?(b.intro/1.6)*40:0;
  ctx.save();ctx.globalAlpha=alpha;
  shadow(x,y+4,70);
  if(b.phase===2){ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,x,y-80,120,`rgba(170,80,220,${.18+.08*Math.sin(G.t*5)})`);ctx.restore()}
  const arm=(side)=>{const sx=x+side*36,sy=y-112+rise,th=b.armT+Math.sin(G.t*1.6+side)*.08,L=78;const mx=sx+Math.sin(th*.6)*side*L*.55,my=sy+Math.cos(th*.6)*L*.55,ex=sx+Math.sin(th)*side*L,ey=sy+Math.cos(th)*L;
    ctx.lineCap='round';ctx.lineJoin='round';[[15,'#1e1218'],[11,'#5a3c44'],[4,'#8a6a72']].forEach(([w,c],i)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(sx-(i===2?side*2:0),sy);ctx.quadraticCurveTo(mx,my,ex,ey);ctx.stroke()});
    ctx.strokeStyle='#3a2a30';ctx.lineWidth=3;for(let k=0;k<3;k++){const a=th+(k-1)*.5;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.sin(a)*side*14,ey+Math.cos(a)*14);ctx.stroke()}
    ell(ctx,ex,ey-4,9,7,'#4d2a63');ell(ctx,ex-2,ey-6,5,4,'#8a5aa0')};
  ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,x,y-90+rise,130,`rgba(150,60,200,${.14+.05*Math.sin(G.t*3)})`);ctx.restore();
  ctx.save();ctx.shadowColor='rgba(40,0,60,.95)';ctx.shadowBlur=8;ctx.drawImage(BOSS_IMG,x-110,y-194+rise);ctx.restore();
  arm(-1);arm(1);
  if(b.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5*alpha;ctx.drawImage(BOSS_IMG,x-110,y-194+rise);ctx.globalAlpha=alpha}
  ctx.globalCompositeOperation='lighter';const pulse=.7+.3*Math.sin(G.t*6);
  [[-18,-96],[18,-96]].forEach(([ox,oy])=>{glow(ctx,x+ox,y+oy+rise,24,b.phase===2?`rgba(255,60,120,${pulse})`:`rgba(220,120,255,${pulse})`);ell(ctx,x+ox,y+oy+rise,4.5,3.5,b.phase===2?'#ffb0c8':'#f0c8ff');ell(ctx,x+ox,y+oy+rise,2,1.6,'#ffffff')});
  ctx.restore();
  if(b.state==='wind'){ctx.save();ctx.globalAlpha=.25+.2*Math.sin(G.t*30);ctx.fillStyle='#ff4a4a';ctx.beginPath();ctx.ellipse(x,y+30,110,50,0,0,TAU);ctx.fill();ctx.restore()}
}
function drawHazard(z){
  if(z.t<z.warn){const k=z.t/z.warn;ctx.save();ctx.globalAlpha=.3+.4*k;ctx.strokeStyle='#c070ff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(z.x,z.y,18,7,0,0,TAU);ctx.stroke();ctx.globalAlpha=.25*k;ctx.fillStyle='#8a3aca';ctx.beginPath();ctx.ellipse(z.x,z.y,18*k,7*k,0,0,TAU);ctx.fill();ctx.restore()}
  else{const k=Math.min(1,(z.t-z.warn)/.1),out=Math.max(0,(z.t-z.warn-z.act)/.2);ctx.save();ctx.globalAlpha=1-out;for(let i=0;i<5;i++){const ox=(i-2)*6,hgt=(i%2?18:26)*k;ctx.fillStyle=i%2?'#4a2e2a':'#6a4a3a';ctx.beginPath();ctx.moveTo(z.x+ox-4,z.y+2);ctx.lineTo(z.x+ox,z.y-hgt);ctx.lineTo(z.x+ox+4,z.y+2);ctx.fill();ctx.fillStyle='#b070d0';ctx.fillRect(z.x+ox-.5,z.y-hgt+2,1,hgt*.4)}ctx.restore()}
}
function drawProj(p){
  if(p.kind==='fire'){ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,p.x,p.y,16,'rgba(255,140,40,.7)');ell(ctx,p.x,p.y,5,5,'#ffe08a');ell(ctx,p.x,p.y,3,3,'#fff');ctx.restore()}
  else if(p.kind==='ice'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle='#d8f4ff';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-4,-3);ctx.lineTo(-6,0);ctx.lineTo(-4,3);ctx.fill();ctx.fillStyle='#6ac0f0';ctx.fillRect(-4,-.5,10,1);ctx.restore()}
  else if(p.kind==='spore'){ctx.save();ctx.globalAlpha=.85;ell(ctx,p.x,p.y,4.5,4.5,'#d8a0c0');ell(ctx,p.x-1,p.y-1,2,2,'#f8e0f0');ctx.restore()}
  else if(p.kind==='orb'){ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,p.x,p.y,11,'rgba(120,180,255,.8)');ell(ctx,p.x,p.y,3,3,'#e8f4ff');ctx.restore()}
  else if(p.kind==='thorn'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle='#2a1a22';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,-3.5);ctx.lineTo(-6,3.5);ctx.fill();ctx.fillStyle='#b070d0';ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-4,-1.5);ctx.lineTo(-4,1.5);ctx.fill();ctx.restore()}
}
function drawDrop(d){
  const blink=d.life<3&&Math.floor(d.life*8)%2;if(blink)return;const y=d.y-d.z-3-Math.sin(G.t*4+d.x)*1.5;shadow(d.x,d.y,4);
  if(d.kind==='coin'){const w=Math.abs(Math.cos(G.t*5+d.x))*4+1;ell(ctx,d.x,y,w,4,'#b8861a');ell(ctx,d.x,y,w*.7,3,'#ffd84a')}
  else if(d.kind==='heart'){ctx.fillStyle='#ff4a6a';ctx.beginPath();ctx.moveTo(d.x,y+4);ctx.bezierCurveTo(d.x-7,y-1,d.x-3,y-6,d.x,y-2);ctx.bezierCurveTo(d.x+3,y-6,d.x+7,y-1,d.x,y+4);ctx.fill();ctx.fillStyle='#ffc0d0';ctx.fillRect(d.x-3,y-3,1.5,1.5)}
  else{ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,d.x,y,9,'rgba(100,160,255,.6)');ctx.restore();ell(ctx,d.x,y,3.5,3.5,'#8ab8ff');ell(ctx,d.x-1,y-1,1.3,1.3,'#fff')}
}
function drawExitArrows(){
  if(G.scene.exitsLocked&&G.boss&&!G.boss.dead)return;
  const bob=Math.sin(G.t*4)*2;
  for(const x of G.scene.exits){const cx=x.x+x.w/2,cy=x.y+x.h/2;let ax=clamp(cx,16,W-16),ay=clamp(cy,18,H-16);if(x.arrow==='up')ay=x.y-6;
    const [dx,dy]=DIRV[x.arrow==='right'?'right':x.arrow==='left'?'left':x.arrow==='up'?'up':'down'];ax+=dx*bob;ay+=dy*bob;if(x.arrow==='right')ax=W-14+dx*bob;if(x.arrow==='left')ax=14+dx*bob;if(x.arrow==='down')ay=H-24+dy*bob;
    ctx.save();ctx.translate(ax,ay);ctx.rotate(Math.atan2(dy,dx));ctx.globalAlpha=.75+.25*Math.sin(G.t*3);ctx.fillStyle='rgba(20,14,8,.6)';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-7);ctx.lineTo(-5,7);ctx.fill();ctx.fillStyle='#ffe8a0';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-3,-5);ctx.lineTo(-3,5);ctx.fill();ctx.restore()}
}
function drawShafts(col='255,250,200',n=4,alpha=.06){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const x=110+i*150+Math.sin(G.t*.3+i)*10,a=alpha+.03*Math.sin(G.t*.7+i*2);const g=ctx.createLinearGradient(x,0,x-80,300);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-10,0);ctx.lineTo(x+32,0);ctx.lineTo(x-40,330);ctx.lineTo(x-116,330);ctx.closePath();ctx.fill()}ctx.restore()}
function drawAmb(){
  for(const a of G.amb){
    if(a.k==='forest'){if(a.leaf){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.t*2);ctx.scale(1,Math.abs(Math.cos(a.t*3))+.2);ctx.fillStyle=a.s>1?'#86d23a':'#5cba2e';ctx.fillRect(-2,-1,4,2.5);ctx.restore()}else{const al=.5+.5*Math.sin(a.t*2.5+a.s*5);ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,a.x,a.y,6,`rgba(220,255,120,${.35*al})`);ctx.fillStyle=`rgba(250,255,200,${al})`;ctx.fillRect(a.x-.5,a.y-.5,1.5,1.5);ctx.restore()}}
    else if(a.k==='village'){const f=Math.abs(Math.sin(a.t*14));ctx.fillStyle=a.s>1?'#fff4a0':'#f8c0e0';ctx.fillRect(a.x-3*f,a.y-1,3*f,2);ctx.fillRect(a.x,a.y-1,3*f,2);ctx.fillStyle='#3a2a2a';ctx.fillRect(a.x-.5,a.y-1.5,1,3)}

  const land=landAt(M.c,M.r);
  panel(90,H-40,460,30,.92);
  let msg=land?`${LANDS[land].name} — Espaço para entrar`:G.arts.length?`Espaço vazio — Espaço para plantar ${ARTS[G.arts[0]].name}`:(M.msg||'Espaço vazio');
  txt(msg,W/2,H-20,`700 12px ${BODY}`,'#f4e8cc','center');
}
function renderPause(){
  ctx.fillStyle='rgba(5,5,3,.65)';ctx.fillRect(0,0,W,H);panel(170,50,300,260,.96);
  txt('Pausa',W/2,84,`400 22px ${DISP}`,'#ffe8a0','center');
  const h=hero,rows=[['Nível',h.lvl],['Ataque',h.atk],['Magia',h.mag],['Ouro',h.gold],['Poções',h.potions]];
  rows.forEach(([k,v],i)=>{txt(k,200,112+i*18,`700 12px ${BODY}`,'#c8bc9c');txt(String(v),300,112+i*18,`800 12px ${BODY}`,'#f4e8cc','right')});
  const ctl=[['Mover','WASD'],['Espada','J'],['Magia','K'],['Esquiva','L'],['Trocar','Q / E'],['Poção','R'],['Falar','Espaço']];
  ctl.forEach(([k,v],i)=>{txt(k,330,112+i*18,`700 12px ${BODY}`,'#c8bc9c');txt(v,450,112+i*18,`800 12px ${BODY}`,'#ffe8a0','right')});
  txt('Magias: '+h.spells.map(s=>SPELLS[s].name).join(', '),W/2,256,`700 12px ${BODY}`,'#bfe8ff','center');
  txt('Esc para voltar · M liga/desliga o som',W/2,290,`500 11px ${BODY}`,'#a89c7c','center');
}
function renderGameOver(){
  ctx.fillStyle=`rgba(10,0,0,${Math.min(.8,G.endT)})`;ctx.fillRect(0,0,W,H);
  if(G.endT>.6){txt('Você desmaiou...',W/2,160,`400 30px ${DISP}`,'#f0b0a0','center','rgba(0,0,0,.9)');txt('A mana te leva de volta à Vila Lumen. Metade do ouro fica pelo caminho.',W/2,192,`500 13px ${BODY}`,'#d8c8b8','center');txt('Espaço para continuar',W/2,230,`800 13px ${BODY}`,'#ffe8a0','center')}
}
function renderEnding(){
  const t=G.endT;ctx.fillStyle=`rgba(8,6,24,${Math.min(.78,t*.4)})`;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';glow(ctx,320,120,260*Math.min(1,t*.3),'rgba(255,190,240,.35)');ctx.restore();
  const lines=[['A Árvore de Mana floresce outra vez.',1],['Pétalas de luz caem sobre Aetheria,',2.5],['e cada terra plantada volta a sonhar.',3.5],['FIM',5.5],['Obrigado por jogar Crônicas de Aetheria',6.5],['Espaço para continuar explorando',8]];
  lines.forEach(([l,at],i)=>{if(t<at)return;const a=Math.min(1,(t-at));ctx.globalAlpha=a;if(l==='FIM')txt(l,W/2,210,`400 40px ${DISP}`,'#ffe8a0','center','rgba(20,10,30,.9)');else txt(l,W/2,i<3?90+i*26:i===4?250:300,i<3?`italic 600 17px ${BODY}`:`700 13px ${BODY}`,i===5?'#ffe8a0':'#f4e8ff','center','rgba(10,5,20,.8)')});
  ctx.globalAlpha=1;
  if(Math.random()<.6)G.amb.push({k:'sanctuary',x:rnd(0,W),y:-10,t:0,vy:rnd(14,26),petal:true,s:1});
}

// ================= main loop =================
let paused=false;
function update(dt){
  G.t+=dt;joyEdges();
  if(PR.mute)toggleMute();
  if(G.fadeDir===1){G.fade+=dt*3.2;if(G.fade>=1){G.fade=1;const p=G.pending;G.pending=null;enterScene(p.id,p.sx,p.sy,p.dir);G.fadeDir=-1}updateFx(dt);return}
  if(G.fadeDir===-1){G.fade-=dt*2.6;if(G.fade<=0){G.fade=0;G.fadeDir=0}}
  if(G.state==='title'){updateTitle();updateFx(dt);return}
  if(G.state==='map'){updateMap(dt);updateFx(dt);return}
  if(G.state==='gameover'){G.endT+=dt;updateFx(dt);if(G.endT>1&&(PR.ok||PR.attack)){hero.hp=hero.maxhp;hero.mp=hero.maxmp;hero.gold=Math.floor(hero.gold/2);hero.inv=0;G.state='play';if(G.boss){G.boss=null}goScene('village',330,290,'down')}return}
  if(G.state==='ending'){G.endT+=dt;updateFx(dt);if(G.endT>8&&(PR.ok||PR.attack)){G.state='play';G.banner={t:0,text:'Aetheria floresce'}}return}
  if(PR.pause&&!D.cur){paused=!paused;sfx('blip')}
  if(paused){return}
  let wdt=dt;if(G.hitstop>0){G.hitstop-=dt;wdt=dt*.08}
  if(D.cur){updateDialog(dt);updateFx(dt);return}
  updateWorld(wdt);updateFx(wdt);
}
function render(){
  ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(G.state==='boot'){txt('Plantando o mundo...',W/2,H/2,`700 14px ${BODY}`,'#e6c36a','center');return}
  if(G.state==='title'){renderTitle()}
  else if(G.state==='map'){renderMap()}
  else{renderWorld();drawHUD();if(G.state==='gameover')renderGameOver();if(G.state==='ending')renderEnding();drawDialog();if(paused)renderPause()}
  drawToasts();drawFade();
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);render()}catch(err){console.error(err)}for(const k in PR)PR[k]=false;requestAnimationFrame(frame)}
function boot(){newHero();render();setTimeout(()=>{TITLE_ART=paintForest(31,{log:1});SC.forest1.art=TITLE_ART;SC.forest1.propList=SC.forest1.props();G.state='title';playSong('sanctuary');cv.focus()},30)}
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load(`400 20px 'Uncial Antiqua'`),document.fonts.load(`700 15px 'Alegreya'`),document.fonts.load(`800 15px 'Alegreya'`)]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(boot);
requestAnimationFrame(frame);
})();
</script>
